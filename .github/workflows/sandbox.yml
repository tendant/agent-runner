name: sandbox
on:
  pull_request:
    paths: ["internal/sandbox/**", "internal/executor/**", "internal/execution/**", "internal/repos/**", "internal/agentsecrets/**", "internal/api/sandbox.go", "cmd/sandbox-*/**", "scripts/sandbox-*", ".github/**", "go.mod"]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go build ./... && go test ./internal/sandbox/... ./internal/executor/...

  # The sandbox end to end, as a normal user (never root): agentbox's
  # conformance suite gated on .github/sandbox-baselines/agentbox-<backend>.json,
  # then the runner probes (scripts/sandbox-smoke).
  smoke:
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, backend: seatbelt }
          - { os: ubuntu-24.04, backend: gvisor }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Install runsc (Linux)
        if: matrix.backend == 'gvisor'
        # agentbox's installer, from the module version agent-runner builds
        # with: runsc, and the AppArmor profiles Ubuntu 24.04 needs for
        # rootless runsc and agentbox-unshare (transparent egress).
        run: |
          sudo apt-get install -y -qq nftables iproute2 >/dev/null
          bash "$(go list -m -f '{{.Dir}}' github.com/tendant/agentbox)/scripts/install-runsc.sh"
      # The real claude CLI, for the smoke's free fake-API session.
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install -g @anthropic-ai/claude-code >/dev/null
      # /tmp, not $RUNNER_TEMP: that is inside the runner's home, which the
      # run's own directories would then show in the home probe.
      - name: Smoke
        run: KEEP=1 TMPDIR=/tmp scripts/sandbox-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-${{ matrix.backend }}
          path: /tmp/sandbox-smoke.*/report-*.json
